; BlankOn Bandit Polybar
; Visual direction inspired by BlackNode: floating surface, rounded pills,
; compact modules, and centered workspaces.

[colors]
background = #ee111018
surface = #f0181420
surface-alt = #2b2233
foreground = #f7f3ed
muted = #a99fb8
purple = #7b3fc6
purple-light = #a86cff
orange = #ff851b
green = #7cff45
red = #ff5c5c

[bar/bandit]
monitor = ${env:MONITOR:}
width = 100%-24pt
height = 36pt
offset-x = 12pt
offset-y = 8pt
fixed-center = true
bottom = false
background = #e6111018
foreground = ${colors.foreground}
line-size = 0pt
border-size = 0pt
radius = 12
padding-left = 50pt
padding-right = 10pt
module-margin = 5pt
font-0 = DejaVu Sans Mono:size=10;2
font-1 = Symbols Nerd Font:size=12;3
modules-left = bandit i3
modules-center = date
modules-right = cpu memory pulseaudio network battery
tray-position = right
tray-padding = 2pt
enable-ipc = true
wm-restack = i3

[module/bandit]
type = custom/text
content = BANDIT
content-foreground = ${colors.foreground}
content-background = ${colors.orange}
content-font = 0
content-padding = 2

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
strip-wsnumbers = true
enable-click = true
enable-scroll = true
wrapping-scroll = false

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.orange}
label-mode-foreground = ${colors.background}

label-focused =  %name% 
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.purple}
label-focused-padding = 2

label-unfocused =  %name% 
label-unfocused-foreground = ${colors.muted}
label-unfocused-background = ${colors.surface-alt}
label-unfocused-padding = 2

label-visible =  %name% 
label-visible-foreground = ${colors.green}
label-visible-background = ${colors.surface-alt}
label-visible-padding = 2

label-urgent =  %name% 
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.orange}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.purple-light}
label = %date%  ·  %time%  
label-foreground = ${colors.foreground}
label-background = ${colors.surface-alt}
label-padding = 3

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
label = CPU %percentage%%
label-foreground = ${colors.green}
label-background = ${colors.surface-alt}
label-padding = 2

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = RAM %percentage_used%%
label-foreground = ${colors.purple-light}
label-background = ${colors.surface-alt}
label-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 2
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-volume-foreground = ${colors.foreground}
label-volume-background = ${colors.surface-alt}
label-volume-padding = 2
label-muted = VOL muted
label-muted-foreground = ${colors.orange}
label-muted-background = ${colors.surface-alt}
label-muted-padding = 2

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
label-connected = WIFI %essid%
label-connected-foreground = ${colors.green}
label-connected-background = ${colors.surface-alt}
label-connected-padding = 2
format-disconnected = <label-disconnected>
label-disconnected = WIFI down
label-disconnected-foreground = ${colors.orange}
label-disconnected-background = ${colors.surface-alt}
label-disconnected-padding = 2

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5
format-charging = <label-charging>
label-charging = BAT %percentage%%
label-charging-foreground = ${colors.green}
label-charging-background = ${colors.surface-alt}
label-charging-padding = 2
format-discharging = <label-discharging>
label-discharging = BAT %percentage%%
label-discharging-foreground = ${colors.foreground}
label-discharging-background = ${colors.surface-alt}
label-discharging-padding = 2
format-full = <label-full>
label-full = BAT full
label-full-foreground = ${colors.green}
label-full-background = ${colors.surface-alt}
label-full-padding = 2
